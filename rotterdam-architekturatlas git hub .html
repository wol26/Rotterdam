<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A7C74">
<title>Rotterdam Architekturatlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:ital,wght@0,400..700;1,400&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface2:#E8EEEC; --ink:#0F2129; --muted:#5E6E77; --line:#DDE5E3;
  --accent:#0A7C74; --accent-soft:#D6EEEA; --coral:#F26B4B; --onimg:#FFFFFF;
  --e1:#9A6232; --e2:#D2402F; --e3:#2D8A6E; --e4:#D08A16; --e5:#2E5BD6; --e6:#8350C8; --e7:#D33D7C;
  --shadow:0 1px 2px rgba(15,33,41,.06),0 8px 24px rgba(15,33,41,.08);
  --f-d:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --f-b:"Figtree","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --tab:64px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1518; --surface:#172126; --surface2:#1F2B31; --ink:#E8EEF0; --muted:#98A8B0; --line:#2A3940;
  --accent:#3CC2B4; --accent-soft:#163A37; --coral:#FF8A6E;
  --e1:#D39A68; --e2:#F27566; --e3:#5CC7A5; --e4:#F0B04A; --e5:#8BA6FF; --e6:#B993F0; --e7:#F07AAE;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1518; --surface:#172126; --surface2:#1F2B31; --ink:#E8EEF0; --muted:#98A8B0; --line:#2A3940;
  --accent:#3CC2B4; --accent-soft:#163A37; --coral:#FF8A6E;
  --e1:#D39A68; --e2:#F27566; --e3:#5CC7A5; --e4:#F0B04A; --e5:#8BA6FF; --e6:#B993F0; --e7:#F07AAE;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:16px;line-height:1.5}
img{max-width:100%;display:block}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-d);margin:0;line-height:1.08;text-wrap:balance;letter-spacing:-.01em}

/* App-Leiste */
.appbar{position:sticky;top:0;z-index:500;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(var(--safe-t) + 10px) 16px 10px;display:flex;align-items:center;gap:12px}
.appbar .logo{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.appbar .logo svg{width:20px;height:20px}
.appbar .ttl{display:grid;line-height:1.15}
.appbar .ttl b{font-family:var(--f-d);font-size:18px;font-weight:750}
.appbar .ttl span{font-size:12.5px;color:var(--muted)}
main{padding-bottom:calc(var(--tab) + var(--safe-b) + 24px)}
.page{max-width:1100px;margin:0 auto;padding-inline:16px}

/* Tab-Leiste */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:900;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + var(--safe-b));display:flex;justify-content:center}
.tabbar .in{display:flex;width:100%;max-width:560px}
.tabbar a{flex:1;display:grid;justify-items:center;gap:2px;padding:6px 0;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:600;border-radius:12px}
.tabbar a svg{width:24px;height:24px}
.tabbar a[aria-current="page"]{color:var(--accent)}
.tabbar a[aria-current="page"] .pill{background:var(--accent-soft)}
.tabbar .pill{padding:3px 16px;border-radius:99px;display:grid}

/* gemeinsame Bausteine */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 12px}
.sec-h h2{font-size:22px;font-weight:750}
.sec-h a,.linkbtn{font-size:14px;font-weight:600;color:var(--accent);text-decoration:none;background:none;border:0;cursor:pointer;padding:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 6px;margin-inline:-16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.ph{background:linear-gradient(135deg,var(--surface2),var(--line));position:relative;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.ph img.ok{opacity:1}
.ph .ini{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-d);font-size:28px;font-weight:800;color:var(--muted);opacity:.5}
.ph img.ok+.ini{display:none}
.credit{position:absolute;right:8px;bottom:6px;font-size:10.5px;color:#fff;background:rgba(0,0,0,.45);padding:1px 6px;border-radius:6px;text-decoration:none;z-index:2}
@media (prefers-reduced-motion:reduce){.ph img{transition:none}}

/* Karussell und Karten */
.hs{display:grid;grid-auto-flow:column;grid-auto-columns:min(72%,260px);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px 12px;margin-inline:-16px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.hs>*{scroll-snap-align:start}
.pc{background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);display:grid;grid-template-rows:auto 1fr;cursor:pointer;border:0;padding:0;text-align:left}
.pc .ph{aspect-ratio:4/3}
.pc .bd{padding:10px 12px 12px;display:grid;gap:3px;align-content:start}
.pc h3{font-size:16.5px;font-weight:700}
.pc .m{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pc .yr{position:absolute;left:10px;top:10px;z-index:2;font-size:12px;font-weight:700;background:var(--surface);color:var(--ink);padding:3px 9px;border-radius:99px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.grid .pc .ph{aspect-ratio:16/10}
.grid .pc p{margin:4px 0 0;font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* Entdecken */
.hero{position:relative;border-radius:24px;overflow:hidden;margin-top:6px;box-shadow:var(--shadow);min-height:340px;display:grid;align-items:end}
.hero .ph{position:absolute;inset:0}
.hero .ov{position:relative;z-index:2;padding:24px 20px 20px;background:linear-gradient(to top,rgba(5,15,20,.85),rgba(5,15,20,.35) 60%,transparent);color:#fff;display:grid;gap:10px}
.hero h1{font-size:clamp(34px,7vw,56px);font-weight:800}
.hero p{margin:0;max-width:56ch;font-size:15.5px;opacity:.92}
.hero .stats{display:flex;gap:8px;flex-wrap:wrap}
.hero .stats span{background:rgba(255,255,255,.18);backdrop-filter:blur(6px);padding:5px 11px;border-radius:99px;font-size:13px;font-weight:600}
.ecards{display:grid;grid-auto-flow:column;grid-auto-columns:min(78%,300px);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px 12px;margin-inline:-16px;scrollbar-width:none}
.ecards::-webkit-scrollbar{display:none}
.ecard{scroll-snap-align:start;position:relative;border-radius:18px;overflow:hidden;min-height:180px;display:grid;align-items:end;text-decoration:none;color:#fff;box-shadow:var(--shadow)}
.ecard .ph{position:absolute;inset:0}
.ecard .ov{position:relative;z-index:2;padding:14px;background:linear-gradient(to top,rgba(5,15,20,.85),transparent);display:grid;gap:2px}
.ecard .n{font-family:var(--f-d);font-weight:800;font-size:13px;letter-spacing:.06em}
.ecard h3{font-size:19px}
.epoch{background:var(--surface);border-radius:22px;padding:20px 18px 18px;margin-top:18px;box-shadow:var(--shadow);scroll-margin-top:80px}
.epoch .hd{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.epoch .num{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-d);font-weight:800;color:#fff;flex:none}
.epoch h2{font-size:24px;font-weight:750}
.epoch .yr{font-size:13px;color:var(--muted);font-weight:600}
.epoch p{margin:0 0 12px;max-width:68ch}
.ideas{display:grid;gap:8px;margin:14px 0}
.idea{background:var(--bg);border-radius:14px;padding:11px 13px}
.idea b{display:block;font-family:var(--f-d);font-size:15.5px;margin-bottom:2px}
.idea span{font-size:14.5px;color:var(--muted)}
@media (min-width:760px){.ideas{grid-template-columns:repeat(2,1fr)}}
.lit{background:var(--surface);border-radius:22px;padding:18px;margin-top:18px;box-shadow:var(--shadow)}
.lit ul{padding-left:18px;margin:8px 0;font-size:14.5px}
.lit li{margin-bottom:6px}

/* Bauwerke */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px;margin:8px 0 12px;box-shadow:var(--shadow)}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;border:0;background:transparent;padding:13px 0;font:inherit;color:var(--ink);outline:none;min-width:0}
.ghead{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.ghead h2{font-size:20px;font-weight:750}
.ghead .yr{font-size:13px;color:var(--muted);font-weight:600}
.empty{color:var(--muted);padding:30px 0;text-align:center}

/* Karte */
#p-karte{max-width:none;padding:0}
.mapview{position:relative;height:calc(100dvh - 58px - var(--safe-t) - var(--tab) - var(--safe-b))}
#bigmap{position:absolute;inset:0;background:var(--surface2)}
.mapchips{position:absolute;z-index:450;top:10px;left:0;right:0;padding-inline:16px}
.mapchips .chips{margin:0;padding:2px 0 6px}
.mapchips .chip{box-shadow:var(--shadow)}
.fabs{position:absolute;z-index:450;right:12px;top:64px;display:grid;gap:8px}
.fab{width:44px;height:44px;border-radius:14px;background:var(--surface);border:0;box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.fab svg{width:22px;height:22px}
.fab[aria-pressed="true"]{background:var(--accent);color:#fff}
.preview{position:absolute;z-index:460;left:12px;right:12px;bottom:12px;max-width:520px;margin-inline:auto;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);display:grid;grid-template-columns:112px minmax(0,1fr);overflow:hidden;cursor:pointer}
.preview .ph{min-height:120px}
.preview .bd{padding:12px 14px;display:grid;gap:4px;align-content:start}
.preview h3{font-size:17px}
.preview .m{font-size:13px;color:var(--muted)}
.preview .acts{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.preview .x{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:99px;border:0;background:var(--surface2);cursor:pointer;display:grid;place-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-weight:650;font-size:14px;text-decoration:none;cursor:pointer}
.btn.sec{background:var(--surface2);color:var(--ink)}
.btn svg{width:16px;height:16px}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);display:grid;place-items:center}
.pin i{width:8px;height:8px;border-radius:50%;background:#fff;transform:rotate(45deg)}
.pin.sel{width:40px;height:40px;border-width:4px}
.me{width:18px;height:18px;border-radius:50%;background:#2E7CF6;border:3px solid #fff;box-shadow:0 0 0 6px rgba(46,124,246,.25)}
.leaflet-container{font-family:var(--f-b)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .osm{filter:invert(1) hue-rotate(180deg) brightness(.95) contrast(.9)}}
:root[data-theme="dark"] .osm{filter:invert(1) hue-rotate(180deg) brightness(.95) contrast(.9)}
.maperr{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}

/* Architekten */
.alist{display:grid;gap:10px}
.arow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);cursor:pointer;border:0;text-align:left;width:100%}
.av{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-family:var(--f-d);font-weight:800;font-size:18px;color:#fff}
.arow b{font-family:var(--f-d);font-size:16.5px;display:block}
.arow span{font-size:13px;color:var(--muted)}
.arow .cnt{font-size:12px;font-weight:700;background:var(--surface2);color:var(--ink);padding:3px 9px;border-radius:99px}
@media (min-width:760px){.alist{grid-template-columns:repeat(2,1fr)}}

/* Detail-Blatt */
.sheet{position:fixed;inset:0;z-index:1000;background:rgba(5,12,15,.45);display:flex;justify-content:center;align-items:flex-end}
.sheet .panel{background:var(--bg);width:100%;max-width:760px;height:100%;overflow-y:auto;overscroll-behavior:contain;position:relative}
@media (min-width:800px){.sheet{align-items:center;padding:24px}.sheet .panel{height:auto;max-height:100%;border-radius:24px}}
.sheet .top{position:relative}
.sheet .top .ph{aspect-ratio:4/3;max-height:58vh;width:100%}
.sheet .top .grad{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.35),transparent 30%);pointer-events:none;z-index:1}
.sheet .close{position:absolute;left:14px;top:calc(var(--safe-t) + 12px);z-index:3;width:40px;height:40px;border-radius:99px;border:0;background:rgba(255,255,255,.92);color:#0F2129;display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow)}
.sheet .close svg{width:20px;height:20px}
.sheet .body{background:var(--bg);border-radius:24px 24px 0 0;margin-top:-22px;position:relative;z-index:2;padding:20px 18px calc(28px + var(--safe-b));display:grid;gap:14px}
.sheet h1{font-size:clamp(26px,5vw,36px);font-weight:800}
.sheet .sub{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:99px;color:#fff}
.badge.o{background:var(--surface2);color:var(--ink)}
.sheet p{margin:0;max-width:68ch}
.why{background:var(--accent-soft);border-radius:16px;padding:12px 14px}
.why b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.facts{display:grid;gap:0;background:var(--surface);border-radius:16px;overflow:hidden}
.facts div{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14.5px}
.facts div:last-child{border-bottom:0}
.facts dt{color:var(--muted);margin:0}
.facts dd{margin:0}
.minimap{height:200px;border-radius:16px;overflow:hidden;background:var(--surface2)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.arch-links{display:grid;gap:8px}
.arch-links .arow{box-shadow:none;border:1px solid var(--line)}
.bio-hd{padding:calc(var(--safe-t) + 70px) 18px 20px;display:grid;gap:10px;justify-items:start}
.bio-hd .av{width:72px;height:72px;font-size:26px;border-radius:22px}
.note{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<header class="appbar">
  <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V9l4-3v15M9 21V4h6v17M15 21V11h4v10"/></svg></div>
  <div class="ttl"><b>Rotterdam Architekturatlas</b><span id="subttl">Entdecken</span></div>
</header>

<main>
  <section id="p-entdecken" class="page"></section>
  <section id="p-bauwerke" class="page" hidden></section>
  <section id="p-karte" class="page" hidden></section>
  <section id="p-architekten" class="page" hidden></section>
</main>

<nav class="tabbar" aria-label="Hauptnavigation"><div class="in">
  <a href="#entdecken" data-p="entdecken"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></span>Entdecken</a>
  <a href="#bauwerke" data-p="bauwerke"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V8l6-4v17M10 21V10h10v11M3 21h18M14 14h2M14 17h2"/></svg></span>Bauwerke</a>
  <a href="#karte" data-p="karte"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg></span>Karte</a>
  <a href="#architekten" data-p="architekten"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></span>Architekten</a>
</div></nav>

<div id="sheet" class="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ---------- EPOCHEN ---------- */
const EPOCHS=[
{id:"e1",n:"I",yr:"bis 1914",t:"Handelsstadt und Welthafen",c:"--e1",
 p:["Rotterdam entstand im 13. Jahrhundert als Damm-Siedlung an der Rotte. Bis ins 19. Jahrhundert war es eine dichte Kaufmannsstadt mit Grachten, der gotischen Laurenskerk und Patrizierhäusern wie dem Schielandshuis. Den Maßstab veränderte erst der Nieuwe Waterweg (1872), der die Stadt direkt mit der Nordsee verband.",
 "Um 1900 wird Rotterdam zum Welthafen. Auf dem Südufer entstehen Hafenbecken, Lagerhäuser und Silos, am Nordufer Kontorhäuser. Architektonisch ist die Zeit eklektisch, aber technisch kühn. Das Witte Huis (1898) erprobt den Hochhausbau, die Maassilo (1910) den Stahlbeton im Industriebau. Die Hafenbauten liefern den Maßstab, der das Rotterdamer Selbstverständnis bis heute prägt: groß, pragmatisch, der Zukunft zugewandt."],
 ideas:[["Historismus und Eklektizismus","Stilformen der Vergangenheit werden frei kombiniert, oft über moderner Konstruktion (Stahl, Beton)."],["Hafen als Stadtmaschine","Silos, Lagerhäuser und Kais sind reine Zweckbauten. Später werden sie zum Vorbild der Moderne und heute zum Umbau-Erbe."]]},
{id:"e2",n:"II",yr:"1914–1940",t:"Tradition, De Stijl und Nieuwe Bouwen",c:"--e2",
 p:["Das rasche Wachstum erzeugt Wohnungsnot. Das Woningwet (Wohnungsgesetz) von 1901 ermöglicht sozialen Wohnungsbau, und die Stadt wird zum Experimentierfeld. Parallel laufen zwei Linien. Die traditionelle, handwerkliche Architektur zeigt sich im Stadhuis, im Hauptpostamt und in den Gartenstädten Vreewijk und Heijplaat. Die Avantgarde bringt J.J.P. Oud, der als Stadtarchitekt (1918–1933) Arbeitersiedlungen baut und als Mitbegründer von De Stijl die Farb- und Raumideen der Gruppe in den Wohnungsbau trägt.",
 "In Spangen erfindet Michiel Brinkman mit dem Justus-van-Effen-Block die Laubengang-Straße in der Luft. Ab Mitte der 1920er-Jahre wird Rotterdam zum Zentrum des Nieuwe Bouwen, der niederländischen Form des Funktionalismus. Die Van-Nelle-Fabrik, das Haus Sonneveld und die Bergpolderflat zeigen Licht, Luft, Stahl und Glas als soziales Programm. Die Architektengruppe Opbouw (gegründet 1920) bildet mit der Amsterdamer De 8 die niederländische CIAM-Sektion. Neue Techniken wie Stahlskelett und Hochhausbau werden in Rotterdam zuerst im Wohnungsbau erprobt."],
 ideas:[["De Stijl","Gegründet 1917 (Van Doesburg, Mondrian, Oud u. a.): Primärfarben, Rechteck, Auflösung der Wand in Flächen. Oud verlässt die Gruppe 1921 nach dem Streit um die Farben in Spangen."],["Nieuwe Bouwen und Nieuwe Zakelijkheid","Funktion, Hygiene, Serienbau, Stahl und Glas. Architektur als Werkzeug der sozialen Reform."],["Gartenstadt und Delftse School","Niedrige Bebauung, Grün, handwerkliche Ziegelarchitektur (Granpré Molière). Die Gegenposition zur Avantgarde."],["Amsterdamse School","Expressive Ziegelarchitektur. In Rotterdam kaum vertreten, am ehesten mit J.F. Staals Beurs, die bereits sachlicher ist."],["Laubengang und Hochhauswohnen","Von Brinkmans „Straße in der Luft“ (1922) bis zur Stahlskelett-Flat Bergpolder (1934)."]]},
{id:"e3",n:"III",yr:"1940–1970",t:"Zerstörung und Wiederaufbau",c:"--e3",
 p:["Am 14. Mai 1940 zerstört die deutsche Luftwaffe die Innenstadt. Rund 25.000 Wohnungen und fast die gesamte historische City gehen verloren, der anschließende Brand vernichtet den Rest. Stadtbaumeister W.G. Witteveen plant zunächst einen eher traditionellen Wiederaufbau. Sein Nachfolger Cornelis van Traa legt 1946 den Basisplan vor, der mit der Vergangenheit bricht: breite Verkehrsachsen, eine Trennung der Funktionen und eine offene, moderne City.",
 "Rotterdam wird zum Schaufenster der Nachkriegsmoderne. Die Lijnbaan (Van den Broek & Bakema) ist eine der ersten geplanten Fußgängerzonen Europas, mit Wohnscheiben dahinter. Maaskant baut Großstrukturen wie das Groothandelsgebouw, eine „Stadt im Gebäude“. Lotte Stam-Beese plant mit Pendrecht nach der Wijkgedachte (Nachbarschaftsidee) Wohnquartiere aus wiederholten „Stempeln“. Bakema trägt die Rotterdamer Erfahrungen in die Kritik von Team 10 am starren CIAM-Funktionalismus."],
 ideas:[["Basisplan (1946)","Van Traas Masterplan: Abkehr vom alten Stadtgrundriss, großzügige Achsen (Coolsingel, Weena), Zonierung."],["Wijkgedachte","Nachbarschaftsidee: Stadt aus überschaubaren, sozial gemischten Einheiten mit eigenen Einrichtungen."],["Stempel","Ein wiederholbares Städtebau-Modul aus gemischten Wohntypen um einen Hof, eingesetzt in Pendrecht."],["Team 10","Bakema, Van Eyck, die Smithsons u. a. stellen „Identität“ und „Assoziation“ gegen die Funktionstrennung der CIAM."]]},
{id:"e4",n:"IV",yr:"1970–1988",t:"Stadterneuerung, Strukturalismus, Postmoderne",c:"--e4",
 p:["Die Kritik an der zugigen, leeren Wiederaufbau-City wächst. Die Stadt setzt auf Stadtvernieuwing (Stadterneuerung) nach dem Motto „bouwen voor de buurt“, also Bauen für die Nachbarschaft: Die Altbauviertel werden mit den Bewohnern erneuert statt abgerissen. Das Wohnen soll in die City zurück.",
 "Piet Bloms Kubuswoningen machen den Strukturalismus sichtbar: Wohnen als Wald, als Dorf in der Stadt. Carel Weeber setzt mit der Peperklip auf strenge Großform und den Neorationalismus. Die Rekonstruktion von Ouds Café De Unie (1986) zeigt, dass Rotterdam seine Moderne als Erbe entdeckt. Junge Büros wie Mecanoo starten mit Wohnungsbau-Wettbewerben. Am Maasufer entsteht mit der Willemswerf von Wim Quist ein neues, repräsentatives Stadtbild zum Fluss."],
 ideas:[["Strukturalismus","Aus der Team-10-Tradition (Van Eyck, Hertzberger, Blom): Bauten aus wiederholten Grundeinheiten, die Aneignung zulassen."],["Bouwen voor de buurt","Stadterneuerung mit und für die Bewohner, kleinteilig und bestandsorientiert."],["Neorationalismus und Postmoderne","Rückkehr zu Großform, Typus und Stadtblock. Weebers „Rotterdamer Realismus“."]]},
{id:"e5",n:"V",yr:"1988–2010",t:"Superdutch und die Stadt am Fluss",c:"--e5",
 p:["Ab den späten 1980er-Jahren wird Rotterdam zur Architekturhauptstadt der Niederlande. Das Nederlands Architectuurinstituut zieht 1993 in einen Neubau am Museumpark, und OMA (Rem Koolhaas) arbeitet von hier aus weltweit. Die Kunsthal (1992) wird zum Manifest einer Architektur aus Bewegung, Rampe und Schnitt. Aus diesem Umfeld gehen MVRDV, West 8, UNStudio und Neutelings Riedijk hervor. International wird der konzeptgetriebene, diagrammatische Stil als „Superdutch“ bekannt.",
 "Städtebaulich springt die Stadt über die Maas. Der Masterplan Kop van Zuid (Teun Koolhaas, ab 1987) verwandelt alte Hafenflächen in ein neues Zentrum, und die Erasmusbrug (1996) ist Brücke und Symbol zugleich. Auf der Wilhelminapier bauen internationale Architekten wie Piano, Foster, Siza und Bolles+Wilson das „Manhattan an der Maas“."],
 ideas:[["Superdutch","Sammelbegriff (Bart Lootsma, 2000) für die konzeptionelle, oft diagrammatische niederländische Architektur der 1990er."],["Programm als Entwurf","Nutzungen werden gestapelt, gefaltet, verschränkt. Die Organisation ersetzt die Stilfrage."],["Stad aan de Maas","Leitbild der 1980er/90er: Die Stadt wendet sich dem Fluss zu, Hafenbrachen werden Stadt."]]},
{id:"e6",n:"VI",yr:"2010–heute",t:"Hybride, vertikale, klimafeste Stadt",c:"--e6",
 p:["Die jüngste Phase verdichtet und verschränkt: De Rotterdam als vertikale Stadt, die Markthal als Hybrid aus Markt und Wohnen, das Timmerhuis als Umbau und Aufstockung. Das neue Centraal Station (2014) macht den Bahnhof zum Stadtraum.",
 "Neue Themen sind Aneignung, Umbau und Klimaanpassung. Die per Crowdfunding finanzierte Luchtsingel (ZUS) zeigt Stadtentwicklung von unten. Das Depot Boijmans (MVRDV, 2021) macht das Museumsdepot öffentlich, das Fenix-Lagerhaus wird mit der „Tornado“-Treppe (MAD, 2025) zum Migrationsmuseum. Dächer, Wasserplätze und Hafenbauten werden zu den neuen Ressourcen der Stadt."],
 ideas:[["Hybrid","Mehrere Programme in einer Struktur (Markthal, De Rotterdam) als Antwort auf die Funktionstrennung der Nachkriegszeit."],["Tijdelijkheid und Aneignung","Temporäre und von unten initiierte Projekte als Planungsinstrument (Luchtsingel)."],["Umbau statt Neubau","Hafenerbe und Nachkriegsbauten werden transformiert (Fenix, Timmerhuis, Maassilo)."]]}
];

/* ---------- ARCHITEKTEN ---------- */
const A={
molenbroek:{n:"Willem Molenbroek",l:"Rotterdamer Architekt, tätig um 1900",r:"Hochhauspionier",bio:"Molenbroek entwarf für die Brüder Van der Schuijt das Witte Huis (1897–98) am Wijnhaven. Mit rund 43 Metern gehört es zu den frühesten Hochhausbauten Europas und war lange das höchste Bürogebäude des Kontinents. Die Architektur ist noch Jugendstil und Historismus, die Idee des vertikalen Bürohauses aber amerikanisch. Das Haus überstand das Bombardement von 1940 und ist heute Rijksmonument."},
stok:{n:"J.P. Stok Wzn.",l:"Ingenieur-Architekt, tätig um 1900–1930",r:"Industriebau in Stahlbeton",bio:"Jacobus Pieter Stok baute für die Graan Elevator Maatschappij die erste Maassilo (1910) an der Maashaven, einen der frühen großen Stahlbetonbauten der Niederlande. Solche Silos und Speicher zählten Le Corbusier und Gropius zu den Vorbildern einer neuen, ornamentfreien Architektur. Die Silo ist heute ein Ort für Kultur und Veranstaltungen."},
muller:{n:"J. Muller, Droogleever Fortuyn & C.B. van der Tak",l:"Rotterdamer Büro, um 1900–1920",r:"Kontorhausbau",bio:"Das Büro baute 1901 und 1917 das Hauptquartier der Holland-Amerika Lijn auf der Wilhelminapier. Von hier fuhren Hunderttausende Auswanderer nach New York. Die zwei Türme mit Kupferhauben und Uhren machten das Gebäude zum Wahrzeichen des Hafens. Seit 1993 ist es das Hotel New York."},
evers:{n:"Henri Evers",l:"1855–1929",r:"Traditionalismus, Professor in Delft",bio:"Evers lehrte an der TH Delft und prägte eine Generation traditionell ausgebildeter Architekten. Sein Stadhuis an der Coolsingel (1914–1920) mischt Renaissance-, Romanik- und Art-déco-Motive. Es ist ein repräsentativer Monumentalbau, gegen den die Moderne später polemisierte. Er überstand den Krieg und ist bis heute Sitz der Stadtregierung."},
bremer:{n:"G.C. Bremer",l:"1880–1949",r:"Rijksbouwmeester",bio:"Als Architekt des Reichs baute Bremer das Hoofdpostkantoor an der Coolsingel (1915–1923). Die Stahlbetonhalle hinter einer schweren Natursteinfassade zeigt die typische Doppelgesichtigkeit der Zeit: moderne Konstruktion, traditionelles Kleid. Das Gebäude überstand 1940 und wird heute zu einem Hotel- und Wohnkomplex umgebaut."},
berlage:{n:"H.P. Berlage",l:"1856–1934",r:"Vater der niederländischen Moderne",bio:"Berlage (Beurs Amsterdam, 1903) steht für Materialwahrheit und die Rolle der Architektur in der Gemeinschaft. Er gilt als Wegbereiter der Amsterdamse School wie des Nieuwe Bouwen. Für Rotterdam lieferte er 1913 den ersten Städtebauentwurf für die Gartenstadt Vreewijk, den Granpré Molière, Verhagen und Kok weiterentwickelten."},
granpre:{n:"M.J. Granpré Molière",l:"1883–1972",r:"Delftse School",bio:"Granpré Molière war Professor in Delft und Leitfigur der Delftse School: eine katholisch geprägte, traditionelle Ziegelarchitektur mit Satteldach als bewusste Gegenposition zum Nieuwe Bouwen. Mit Verhagen und Kok baute er die Gartenstadt Vreewijk (ab 1916). Nach 1945 bestimmte seine Schule einen großen Teil des ländlichen Wiederaufbaus."},
baanders:{n:"H.A.J. & J. Baanders",l:"Amsterdamer Architektenbrüder",r:"Werkswohnungsbau",bio:"Die Brüder Baanders planten für die Rotterdamsche Droogdok Maatschappij (RDM) das Tuindorp Heijplaat (1914–1918). Es war ein Werksdorf mitten im Hafen, isoliert vom Rest der Stadt, mit eigenen Schulen, Läden und Vereinshaus. Heijplaat zeigt die Gartenstadt-Idee als unternehmerisches Sozialprojekt."},
oud:{n:"J.J.P. Oud",l:"1890–1963",r:"De Stijl, Nieuwe Bouwen, Stadtarchitekt",bio:"Oud war 1917 Mitbegründer von De Stijl und von 1918 bis 1933 Architekt des Gemeentelijke Woningdienst in Rotterdam. In Spangen, Tusschendijken, Oud-Mathenesse (Witte Dorp) und der Kiefhoek entwickelte er standardisierte Arbeiterwohnungen, die international als Musterbeispiele des sozialen Funktionalismus galten. Sein Café De Unie (1925) übersetzte die De-Stijl-Malerei in eine Fassade. 1927 baute er Reihenhäuser für die Weißenhofsiedlung Stuttgart, und 1932 zeigte ihn das MoMA in der Ausstellung „Modern Architecture“. Später wandte er sich einer monumentaleren Architektur zu."},
vandoesburg:{n:"Theo van Doesburg",l:"1883–1931",r:"De-Stijl-Theoretiker",bio:"Maler, Theoretiker und Herausgeber der Zeitschrift De Stijl. Van Doesburg entwarf 1921 die Farbgebung für Ouds Wohnblöcke in Spangen. Der Streit darüber, ob Farbe die Architektur unterstützen oder autonom auflösen soll, führte zum Bruch zwischen beiden. Sein Einfluss reichte über seine Kurse in Weimar bis ans Bauhaus."},
mbrinkman:{n:"Michiel Brinkman",l:"1873–1925",r:"Laubengang-Wohnen",bio:"Brinkman baute 1919–1922 in Spangen den Justus-van-Effen-Block, einen riesigen Hofblock mit einer umlaufenden Galerie im zweiten Obergeschoss. Die Galerie ist breit genug für Lieferkarren und Nachbarschaftsleben. Alison und Peter Smithson beriefen sich darauf für ihre Idee der „streets in the air“. Sein Sohn J.A. Brinkman führte das Büro mit Van der Vlugt weiter."},
bvdv:{n:"Brinkman & Van der Vlugt",l:"J.A. Brinkman (1902–1949), L.C. van der Vlugt (1894–1936)",r:"Nieuwe Bouwen",bio:"Das wichtigste Büro des Rotterdamer Funktionalismus. Johannes Brinkman und Leendert van der Vlugt bauten die Van-Nelle-Fabrik (1925–1931, UNESCO-Welterbe seit 2014), das Haus Sonneveld (1929–1933), das Stadion De Kuip und zusammen mit Van Tijen die Bergpolderflat. Typisch sind Stahl- und Betonskelette, Vorhangfassaden, Licht und technische Präzision. Nach Van der Vlugts Tod 1936 übernahm Jo van den Broek dessen Rolle; daraus entstand später das Büro Van den Broek & Bakema."},
stam:{n:"Mart Stam",l:"1899–1986",r:"Nieuwe Bouwen, Freischwinger",bio:"Stam arbeitete 1926–1928 im Büro Brinkman & Van der Vlugt am Entwurf der Van-Nelle-Fabrik mit; sein Anteil ist in der Forschung viel diskutiert. Er baute in der Weißenhofsiedlung, gilt als Erfinder des hinterbeinlosen Stahlrohrstuhls, lehrte am Bauhaus und plante mit Ernst May in der Sowjetunion. Er war mit Lotte Beese verheiratet."},
dudok:{n:"W.M. Dudok",l:"1884–1974",r:"Moderne Kubik",bio:"Dudok, Stadtarchitekt von Hilversum (Rathaus 1931), verband die Kubik von De Stijl und Frank Lloyd Wright mit der Ziegeltradition. In Rotterdam baute er das Warenhaus De Bijenkorf (1929–1930) mit einer großen Glashalle. Nach Kriegsschäden wurde es 1960 abgerissen, was bis heute als großer Verlust des Rotterdamer Erbes gilt."},
vantijen:{n:"Willem van Tijen",l:"1894–1974",r:"Wohnungsbau, Hochhauswohnen",bio:"Van Tijen machte das Wohnhochhaus für Arbeiter möglich. Die Bergpolderflat (1932–1934, mit Brinkman & Van der Vlugt) ist das erste Galerie-Wohnhochhaus der Niederlande in Stahlskelett-Bauweise, die Plaslaanflat (1937–1938, mit Maaskant) seine bürgerliche Variante. Nach dem Krieg baute er mit Maaskant das Groothandelsgebouw und prägte den Wiederaufbau-Wohnungsbau wesentlich."},
maaskant:{n:"Hugh Maaskant",l:"1907–1977",r:"Wiederaufbau, Großstrukturen",bio:"Maaskant ist der Architekt des Rotterdamer Wiederaufbaus. Mit Van Tijen baute er das Groothandelsgebouw (1949–1953) und das Industriegebouw (1948–1952), beides Großbauten, die eine ganze Stadt in sich aufnehmen. Allein folgten Euromast (1960), Hilton (1964) und viele Firmenbauten. Er stand für Optimismus, Technik und Maßstab statt Theorie; seine Bauten wurden erst spät als Erbe anerkannt."},
staal:{n:"J.F. Staal",l:"1879–1940",r:"Amsterdamse School, später sachlich",bio:"Staal gehörte zum Umfeld der Amsterdamse School. Sein letztes großes Werk ist die Rotterdamer Beurs (1936–1940), heute Teil des World Trade Center. Der kühle, sachliche Klinker- und Natursteinbau mit Uhrturm zeigt den Übergang von der expressiven Schule zu einer gemäßigten Moderne. Er überstand das Bombardement nur knapp."},
ravesteyn:{n:"Sybold van Ravesteyn",l:"1889–1983",r:"Vom Funktionalismus zum „Neobarock“",bio:"Van Ravesteyn begann als Funktionalist und Ingenieur-Architekt bei der Eisenbahn, wandte sich dann aber provokant einer barock-geschwungenen Moderne zu. In Rotterdam baute er die Tierpark-Anlagen von Blijdorp (1937–1941, u. a. Rivièrahal) und das Centraal Station (1957, 2007 abgerissen). Er gilt als eigenwilliger Außenseiter der niederländischen Moderne."},
vandenbroek:{n:"J.H. van den Broek",l:"1898–1978",r:"Nieuwe Bouwen, Wiederaufbau",bio:"Jo van den Broek baute zunächst eigene funktionalistische Wohnbauten und übernahm 1937 den Platz des verstorbenen Van der Vlugt bei Brinkman. Ab 1948 bildete er mit Jaap Bakema das einflussreichste Büro des Wiederaufbaus. Ihr gemeinsames Werk ist die Lijnbaan (1953). Als Professor in Delft prägte er Generationen von Architekten."},
bakema:{n:"Jaap Bakema",l:"1914–1981",r:"Team 10, Wiederaufbau",bio:"Bakema war Mitglied von Opbouw, Sekretär der späten CIAM und eine zentrale Figur von Team 10. Er suchte eine Architektur, die das „offene Gesellschaftsleben“ räumlich ausdrückt. Mit Van den Broek baute er die Lijnbaan (1953), Stadtteile und große Wohnbauten und publizierte die Team-10-Ideen im Forum-Magazin. Sein Archiv liegt im Nieuwe Instituut."},
vantraa:{n:"Cornelis van Traa",l:"1899–1970",r:"Stadtplaner, Basisplan",bio:"Van Traa leitete ab 1944 den Wiederaufbau und legte 1946 den Basisplan vor. Er war ein moderner Masterplan mit breiten Verkehrsachsen, klarer Zonierung und einer offenen City, der den alten Stadtgrundriss weitgehend aufgab. Damit schuf er das Fundament, auf dem Lijnbaan, Weena und die heutige Hochhaus-City entstanden."},
stambeese:{n:"Lotte Stam-Beese",l:"1903–1988",r:"Städtebau, Bauhaus, Wijkgedachte",bio:"Lotte Beese studierte am Bauhaus, arbeitete in der Sowjetunion und kam über Amsterdam nach Rotterdam. Von 1946 bis 1968 war sie Stadtplanerin bei der Gemeinde, lange als einzige Frau. Sie entwarf die Stadterweiterung Pendrecht mit wiederholten „Stempeln“ aus gemischten Wohntypen. Pendrecht wurde auf der CIAM-Konferenz in Aix-en-Provence (1953) international diskutiert."},
breuer:{n:"Marcel Breuer",l:"1902–1981",r:"Bauhaus, internationale Moderne",bio:"Breuer, Bauhaus-Absolvent und Möbelentwerfer (Wassily-Stuhl), emigrierte über London in die USA. Für De Bijenkorf baute er in Rotterdam 1955–1957 ein fensterloses Warenhaus mit wabenartiger Natursteinfassade, zusammen mit A. Elzas. Davor steht Naum Gabos 26 Meter hohe Stahlskulptur. Der Bau ist eines der wichtigsten Werke der Nachkriegsmoderne in den Niederlanden."},
blom:{n:"Piet Blom",l:"1934–1999",r:"Strukturalismus",bio:"Blom war Schüler von Aldo van Eyck und dachte Wohnen als „urbanes Dach“ und als Wald. Seine Kubuswoningen (Helmond 1977, Rotterdam 1978–1984) sind auf die Spitze gestellte Würfel auf Pfeilern über einer Fußgängerbrücke; dazu gehört das Wohnhochhaus „Het Potlood“. Blom ist die Schlüsselfigur, um den niederländischen Strukturalismus in Rotterdam zu verstehen."},
weeber:{n:"Carel Weeber",l:"geb. 1937",r:"Neorationalismus, „Rotterdamer Realismus“",bio:"Weeber stellte sich provokant gegen die kleinteilige Stadterneuerung und forderte große Form und Freiheit im Wohnungsbau. Seine Peperklip (1979–1982) ist ein über 500 Meter langer, büroklammerförmiger Wohnblock. Er rekonstruierte Ouds Café De Unie (1986) an neuem Ort. Als Vorsitzender des BNA prägte er die Architekturpolitik der 1980er."},
mecanoo:{n:"Mecanoo (Francine Houben u. a.)",l:"gegr. 1984 in Delft",r:"Wohnungsbau, Landschaftlichkeit",bio:"Mecanoo entstand aus dem gewonnenen Wettbewerb für Wohnungen am Kruisplein (1985), gegründet von Francine Houben, Henk Döll, Erick van Egeraat u. a. Das Büro verbindet die Tradition des Nieuwe Bouwen mit Collage, Material und Landschaft. In Rotterdam baute es u. a. den Montevideo-Turm (2005)."},
quist:{n:"Wim Quist",l:"geb. 1930",r:"Rationaler Monumentalismus",bio:"Quist war Reichsbaumeister und baute in Rotterdam das Maritiem Museum (1986) und die Willemswerf (1983–1989), das weiße, schräg angeschnittene Bürohochhaus an den Boompjes. Seine Architektur steht für geometrische Strenge und Präzision. Mit der Willemswerf beginnt die neue Hochhaus-Silhouette am Fluss."},
oma:{n:"Rem Koolhaas / OMA",l:"geb. 1944; OMA gegr. 1975",r:"Delirious New York, Programm und Bigness",bio:"Koolhaas, ehemaliger Journalist, erforschte in „Delirious New York“ (1978) die Kultur der Verdichtung und gründete OMA, das seit 1978 in Rotterdam sitzt. Die Kunsthal (1992), der Museumpark, das Timmerhuis (2015) und De Rotterdam (2013) zeigen die Leitideen: Programm statt Form, Rampe und Schnitt, „Bigness“ als vertikale Stadt. OMA bildete die Generation der Superdutch-Büros aus (MVRDV, Neutelings, u. a.). Pritzker-Preis 2000."},
coenen:{n:"Jo Coenen",l:"geb. 1949",r:"Rationalismus, Stadtbaukunst",bio:"Coenen gewann 1988 den Wettbewerb für das Nederlands Architectuurinstituut (heute Het Nieuwe Instituut, 1993). Das Ensemble aus Archiv-Riegel über Pfeilern, Glas-Ausstellungshalle und Pergola bildet mehrere Architekturauffassungen bewusst nebeneinander ab. Später war er Rijksbouwmeester."},
west8:{n:"West 8 (Adriaan Geuze)",l:"gegr. 1987",r:"Landschaftsarchitektur und Stadtraum",bio:"West 8 machte Rotterdam zum Labor der Landschaftsarchitektur. Der Schouwburgplein (1991–1996) ist eine erhöhte, leere Bühne mit hydraulischen Lichtmasten, die an Hafenkräne erinnern. Das Büro war Teil von Team CS für den neuen Hauptbahnhof (2014)."},
unstudio:{n:"UNStudio (Ben van Berkel)",l:"Van Berkel geb. 1957",r:"Brückenbau, Infrastruktur als Architektur",bio:"Ben van Berkel entwarf die Erasmusbrug (1990–1996), die „Schwan“ genannte Schrägseilbrücke mit geknicktem Pylon. Sie verbindet Kop van Zuid mit dem Zentrum. Mit Caroline Bos gründete er 1998 UNStudio, dessen Werk um Diagramm, Fluss und Infrastruktur als Architektur kreist."},
bolleswilson:{n:"Bolles+Wilson",l:"Julia Bolles-Wilson & Peter Wilson, Münster",r:"Expressiver Kontextualismus",bio:"Das deutsch-australische Büro baute das Nieuwe Luxor Theater (1996–2001) an der Kop van Zuid. Der rote, skulpturale Körper mit Anlieferungsrampe um das Gebäude reagiert auf Wasser, Brücke und Verkehr. Es ist ein Beispiel für die internationale Öffnung Rotterdams in den 1990ern."},
piano:{n:"Renzo Piano",l:"geb. 1937",r:"High-Tech, Tektonik",bio:"Piano (Centre Pompidou mit Rogers) baute auf der Wilhelminapier den KPN-Turm (1997–2000). Die geneigte Fassade ist mit Tausenden Leuchten als Medienfassade bespielbar und wird von einer schrägen Stütze gehalten. Pritzker-Preis 1998."},
foster:{n:"Norman Foster",l:"geb. 1935",r:"High-Tech",bio:"Foster + Partners bauten das World Port Center (1997–2001) an der Spitze der Wilhelminapier, einen Büroturm mit gekrümmtem Grundriss für den Hafenbetrieb. Pritzker-Preis 1999."},
siza:{n:"Álvaro Siza",l:"geb. 1933",r:"Kritischer Regionalismus",bio:"Der portugiesische Architekt (Pritzker 1992) baute auf der Wilhelminapier den Wohnturm New Orleans (2006–2010), mit rund 158 Metern damals das höchste Wohnhaus der Niederlande. Die ruhige Steinfassade setzt einen bewusst zurückhaltenden Akzent zwischen expressiven Nachbarn."},
teamcs:{n:"Team CS (Benthem Crouwel, MVSA, West 8)",l:"Arbeitsgemeinschaft, 2004–2014",r:"Infrastruktur als Stadtraum",bio:"Benthem Crouwel, Meyer en Van Schooten und West 8 entwarfen gemeinsam das neue Centraal Station (2014). Die spitz auf die City weisende Halle mit Holzdecke und großem Solardach über den Gleisen ersetzt Van Ravesteyns Bau von 1957, dessen Leuchtschrift „Centraal Station“ übernommen wurde."},
mvrdv:{n:"MVRDV (Winy Maas, Jacob van Rijs, Nathalie de Vries)",l:"gegr. 1993",r:"Superdutch, Datascapes, Hybride",bio:"Die drei gründeten MVRDV nach Jahren bei OMA und Mecanoo in Rotterdam. Bekannt wurden sie mit radikal diagrammatischen Projekten (WoZoCo Amsterdam, Expo-Pavillon Hannover 2000). In Rotterdam stehen die Markthal (2014), Didden Village (2006) und das Depot Boijmans Van Beuningen (2021). Ihre Themen sind Verdichtung, Stapelung und Öffentlichkeit."},

  const host=m[1]==="commons"?"commons.wikimedia.org":m[1]+".wikipedia.org";return `https://${host}/wiki/File:${m[2]}`;}
function toThumb(src,width){if(/\/thumb\//.test(src))return src.replace(/\/\d+px-/,`/${width}px-`);
  const m=src.match(/^(https:\/\/upload\.wikimedia\.org\/wikipedia\/[a-z]+\/)([0-9a-f]\/[0-9a-f]{2}\/)([^/]+)$/);return m?`${m[1]}thumb/${m[2]}${m[3]}/${width}px-${m[3]}`:src;}
const okExt=u=>/\.(jpe?g|png|webp)(\/|$)/i.test(u.split("?")[0].replace(/\/\d+px-[^/]+$/,""))||/\.(jpe?g|png|webp)$/i.test(u);
async function fromWiki(spec){const [lang,...t]=spec.split(":");const title=t.join(":").replace(/ /g,"_");
  const j=await getJSON(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);
  if(j.type==="disambiguation")throw 0;const o=j.originalimage;if(!o||!okExt(o.source))throw 0;
  const src=o.width<=W?o.source:toThumb(o.source,W);
  return [{src,page:fileInfo(o.source)||j.content_urls?.desktop?.page,cr:"Wikipedia/Wikimedia"}];}
async function fromCommons(q){const j=await getJSON(`https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=5&gsrsearch=${encodeURIComponent(q+" filetype:bitmap")}&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=${W}`);
  const ps=Object.values(j.query?.pages||{}).sort((a,b)=>a.index-b.index).filter(p=>p.imageinfo&&/\.(jpe?g|png|webp)$/i.test(p.title));
  if(!ps.length)throw 0;
  return ps.map(p=>{const ii=p.imageinfo[0];const artist=(ii.extmetadata?.Artist?.value||"").replace(/<[^>]+>/g,"").trim().slice(0,40);const lic=ii.extmetadata?.LicenseShortName?.value||"";
    return {src:ii.thumburl||ii.url,page:ii.descriptionurl,cr:[artist,lic].filter(Boolean).join(" · ")||"Wikimedia Commons"};});}
async function fromWikiSearch(lang,q){const j=await getJSON(`https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=3&gsrsearch=${encodeURIComponent(q)}&prop=pageimages&piprop=original`);
  const ps=Object.values(j.query?.pages||{}).sort((a,b)=>a.index-b.index).filter(p=>p.original&&okExt(p.original.source));if(!ps.length)throw 0;
  return ps.map(p=>({src:p.original.width<=W?p.original.source:toThumb(p.original.source,W),page:fileInfo(p.original.source)||`https://${lang}.wikipedia.org/wiki/${encodeURIComponent(p.title)}`,cr:"Wikipedia/Wikimedia"}));}
function sources(id){const s=IMG[id]||{};const b=BI[id],name=b.n.replace(/\(.*?\)/g,"").trim();const t=[];
  if(s.w)t.push(()=>fromWiki(s.w));if(s.c)t.push(()=>fromCommons(s.c));
  t.push(()=>fromWikiSearch("nl",name+" Rotterdam"),()=>fromWikiSearch("en",name+" Rotterdam"),()=>fromCommons(name+" Rotterdam"));
  if(ADDR[id])t.push(()=>fromCommons(ADDR[id].split(",").slice(-2).join(" ").trim()));
  if(s.fb)t.push(()=>fromWiki((IMG[s.fb]||{}).w||"en:x"));
  return t;}
/* liefert nacheinander Kandidaten; ein Bild, das nicht lädt, wird übersprungen */
function candidates(id){const st={list:IC[id]?[IC[id]]:[],i:0,srcs:sources(id),si:0,seen:new Set()};
  return async function next(){while(true){
    while(st.i<st.list.length){const c=st.list[st.i++];if(!st.seen.has(c.src)){st.seen.add(c.src);return c;}}
    if(st.si>=st.srcs.length)return null;try{st.list.push(...await st.srcs[st.si++]());}catch(e){}}};}
function ph(id,cls="",credit=false){return `<div class="ph ${cls}" data-img="${id}" ${credit?'data-credit="1"':''}><img alt="${esc(BI[id].n)}" decoding="async"><div class="ini">${esc(initials(BI[id].n))}</div></div>`;}
function hydrate(root=document){
  root.querySelectorAll(".ph[data-img]:not([data-done])").forEach(el=>{el.dataset.done=1;const id=el.dataset.img;const next=candidates(id);const img=el.querySelector("img");
    const tryNext=async()=>{const c=await next();if(!c){if(IC[id]){delete IC[id];saveIC();}return;}
      img.onload=()=>{img.classList.add("ok");IC[id]=c;saveIC();
        if(el.dataset.credit&&c.page&&!el.querySelector(".credit")){const a=document.createElement("a");a.className="credit";a.href=c.page;a.target="_blank";a.rel="noopener";a.textContent="Foto: "+c.cr;el.appendChild(a);}};
      img.onerror=()=>tryNext();img.src=c.src;};
    const io=("IntersectionObserver" in window)?new IntersectionObserver((es,o)=>{if(es.some(e=>e.isIntersecting)){o.disconnect();tryNext();}},{rootMargin:"400px"}):null;
    if(io)io.observe(el);else tryNext();});}

let bFilter="all",bQuery="";
function pageBauwerke(){
  return `<label class="search">${ICON.search}<input id="q" type="search" placeholder="Suche nach Gebäude, Architekt, Stil …" autocomplete="off"></label>
  <div class="chips" id="bchips"><button class="chip" data-e="all" aria-pressed="true">Alle</button>${EPOCHS.map(e=>`<button class="chip" data-e="${e.id}" aria-pressed="false"><span class="dot" style="background:var(${e.c})"></span>${e.id==="e7"?"Stadtleben":e.yr}</button>`).join("")}</div>

}
function drawBauwerke(){
  const q=bQuery.trim().toLowerCase();
  const match=b=>(bFilter==="all"||b.e===bFilter)&&(!q||[b.n,b.st,b.addr,archNames(b),b.t].join(" ").toLowerCase().includes(q));

let map,mini,markers={},mFilter=new Set(EPOCHS.map(e=>e.id)),mSel=null,base,sat,satOn=false,meMarker=null;
function pageKarte(){

const dark=()=>getComputedStyle(document.documentElement).colorScheme.includes("dark");
function pinIcon(b,sel){const c=getComputedStyle(document.documentElement).getPropertyValue(EI[b.e].c).trim();
  return L.divIcon({className:"",html:`<div class="pin${sel?" sel":""}" style="background:${c}"><i></i></div>`,iconSize:sel?[40,40]:[30,30],iconAnchor:sel?[20,40]:[15,30]});}
function osmLayer(){return L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,className:"osm",attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'});}
function initMap(){
  if(typeof L==="undefined"){document.getElementById("bigmap").innerHTML=`<div class="maperr">Die Karte braucht eine Internetverbindung (Leaflet und Kartenkacheln werden online geladen).</div>`;return;}
  map=L.map("bigmap",{zoomControl:false,attributionControl:true}).setView([51.914,4.475],13);
  L.control.zoom({position:"bottomleft"}).addTo(map);
  base=osmLayer().addTo(map);
  sat=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Luftbild © Esri, Maxar, Earthstar Geographics"});
  B.forEach(b=>{markers[b.id]=L.marker([b.lat,b.lon],{icon:pinIcon(b,false),title:b.n,keyboard:true}).on("click",()=>selectMap(b.id,false));});
  syncMarkers();fitAll();
  map.on("click",()=>selectMap(null));
  document.getElementById("mchips").addEventListener("click",e=>{const c=e.target.closest(".chip");if(!c)return;const id=c.dataset.e;
    if(mFilter.size===EPOCHS.length)mFilter=new Set([id]);else if(mFilter.has(id)){mFilter.delete(id);if(!mFilter.size)mFilter=new Set(EPOCHS.map(x=>x.id));}else mFilter.add(id);syncMarkers();});
  document.getElementById("fSat").onclick=e=>{satOn=!satOn;e.currentTarget.setAttribute("aria-pressed",satOn);if(satOn){map.removeLayer(base);sat.addTo(map);}else{map.removeLayer(sat);base.addTo(map);}};
  document.getElementById("fFit").onclick=fitAll;
  document.getElementById("fLocate").onclick=()=>{if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(p=>{const ll=[p.coords.latitude,p.coords.longitude];
    if(!meMarker)meMarker=L.marker(ll,{icon:L.divIcon({className:"",html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]}),zIndexOffset:1000}).addTo(map);else meMarker.setLatLng(ll);map.flyTo(ll,16);},
    ()=>alertBox("Standort nicht verfügbar. Erlaube den Standortzugriff im Browser."),{enableHighAccuracy:true,timeout:10000});};
}
function alertBox(t){const p=document.getElementById("mprev");p.innerHTML=`<div class="preview" style="grid-template-columns:1fr;cursor:default"><div class="bd"><p style="margin:0">${esc(t)}</p></div></div>`;setTimeout(()=>{if(p.textContent.includes(t))p.innerHTML="";},3500);}
function syncMarkers(){B.forEach(b=>{const m=markers[b.id];if(mFilter.has(b.e))m.addTo(map);else m.remove();});
  document.querySelectorAll("#mchips .chip").forEach(c=>c.setAttribute("aria-pressed",mFilter.has(c.dataset.e)));
  if(mSel&&!mFilter.has(BI[mSel].e))selectMap(null);}
function fitAll(){const ll=B.filter(b=>mFilter.has(b.e)).map(b=>[b.lat,b.lon]);if(ll.length)map.fitBounds(ll,{padding:[50,50]});}
function selectMap(id,fly){
  if(mSel&&markers[mSel])markers[mSel].setIcon(pinIcon(BI[mSel],false)).setZIndexOffset(0);
  mSel=id;const p=document.getElementById("mprev");
  if(!id){p.innerHTML="";return;}
  const b=BI[id];markers[id].setIcon(pinIcon(b,true)).setZIndexOffset(900);
  if(fly)map.flyTo([b.lat,b.lon],16,{duration:.8});
  p.innerHTML=`<div class="preview" data-open="${id}">${ph(id)}<div class="bd"><div class="m">${b.s>2026?"heute":b.y} · <span style="color:${ecol(b.e)};font-weight:700">${esc(b.st)}</span></div><h3>${esc(b.n)}</h3><div class="m">${esc(archNames(b))}</div>

}

function dist(a,b){const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLon=(b.lon-a.lon)*Math.PI/180;const x=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function nearby(b){const n=B.filter(x=>x.id!==b.id).map(x=>[x,dist(b,x)]).sort((p,q)=>p[1]-q[1]).slice(0,6);
  return `<div class="sec-h" style="margin:8px 0 0"><h2 style="font-size:18px">In der Nähe</h2></div><div class="hs">${n.map(([x,d])=>pcard(x).replace('</h3>',`</h3><div class="m">${d<1?Math.round(d*1000)+" m":d.toFixed(1)+" km"} entfernt</div>`)).join("")}</div>`;}
function openArchitect(id){const a=A[id];if(!a)return;const ws=B.filter(b=>b.a.includes(id));const e=ws[0]?ws[0].e:"e5";
  const panel=document.getElementById("panel");
  panel.innerHTML=`<div style="position:relative"><button class="close" data-sheetclose aria-label="Zurück">${ICON.back}</button></div>
  <div class="bio-hd"><div class="av" style="background:${ecol(e)}">${esc(initials(a.n))}</div><span class="eyebrow">${esc(a.r)}</span><h1>${esc(a.n)}</h1><span class="note">${esc(a.l)}</span></div>
  <div class="body" style="margin-top:0;border-radius:0"><p>${a.bio}</p>
  <div class="sec-h" style="margin:6px 0 0"><h2 style="font-size:18px">Bauten in Rotterdam</h2></div><div class="hs">${ws.map(b=>pcard(b)).join("")}</div>
  <div class="chips">${[...new Set(ws.map(b=>b.e))].map(x=>`<a class="chip" href="#e-${x}"><span class="dot" style="background:${ecol(x)}"></span>${EI[x].t}</a>`).join("")}</div></div>`;
  showSheet();hydrate(panel);}
let lastFocus=null;
function showSheet(){const s=document.getElementById("sheet");if(s.hidden)lastFocus=document.activeElement;s.hidden=false;document.getElementById("panel").scrollTop=0;document.body.style.overflow="hidden";setTimeout(()=>{const c=s.querySelector("[data-sheetclose]");c&&c.focus({preventScroll:true});},30);}
function hideSheet(){const s=document.getElementById("sheet");if(s.hidden)return;s.hidden=true;document.body.style.overflow="";if(mini){mini.remove();mini=null;}lastFocus&&lastFocus.focus&&lastFocus.focus({preventScroll:true});}

/* ---------- Router ---------- */
const PAGES=["entdecken","bauwerke","karte","architekten"],TITLES={entdecken:"Entdecken",bauwerke:"Bauwerke chronologisch",karte:"Karte",architekten:"Architekten"};
const rendered={};let cur="entdecken";
function ensure(p){if(rendered[p])return;const el=document.getElementById("p-"+p);
  el.innerHTML={entdecken:pageEntdecken,bauwerke:pageBauwerke,karte:pageKarte,architekten:pageArchitekten}[p]();rendered[p]=true;
  if(p==="bauwerke"){drawBauwerke();document.getElementById("q").addEventListener("input",e=>{bQuery=e.target.value;drawBauwerke();});
    document.getElementById("bchips").addEventListener("click",e=>{const c=e.target.closest(".chip");if(!c)return;bFilter=c.dataset.e;drawBauwerke();});}
  if(p==="karte")initMap();hydrate(el);}
function show(p){const changed=cur!==p;cur=p;PAGES.forEach(x=>document.getElementById("p-"+x).hidden=x!==p);
  document.querySelectorAll(".tabbar a").forEach(a=>{if(a.dataset.p===p)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");});
  document.getElementById("subttl").textContent=TITLES[p];if(p==="karte"&&map)setTimeout(()=>map.invalidateSize(),50);return changed;}
function route(){
  const h=decodeURIComponent((location.hash||"#entdecken").slice(1));
  if(h.startsWith("b-")){if(!rendered[cur])ensure(cur),show(cur);openBuilding(h.slice(2));return;}
  if(h.startsWith("a-")){if(!rendered[cur])ensure(cur),show(cur);openArchitect(h.slice(2));return;}
  hideSheet();
  if(h.startsWith("k-")){ensure("karte");show("karte");window.scrollTo(0,0);if(map){const id=h.slice(2);if(BI[id]&&!mFilter.has(BI[id].e)){mFilter.add(BI[id].e);syncMarkers();}setTimeout(()=>{map.invalidateSize();selectMap(id,true);},60);}return;}
  if(h.startsWith("e-")){ensure("entdecken");show("entdecken");const el=document.getElementById(h);if(el)el.scrollIntoView({block:"start"});return;}
  const p=PAGES.includes(h)?h:"entdecken";ensure(p);if(show(p))window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
document.addEventListener("click",e=>{
  if(e.target.closest("[data-sheetclose]")){e.preventDefault();location.hash=cur;return;}
  if(e.target===document.getElementById("sheet")){location.hash=cur;return;}
  if(e.target.closest("[data-close]")){e.stopPropagation();selectMap(null);return;}
  const f=e.target.closest("[data-filter]");if(f){mFilter=new Set([f.dataset.filter]);if(map){syncMarkers();setTimeout(fitAll,80);}}
  const o=e.target.closest(".preview[data-open]");if(o&&!e.target.closest("a,button")){location.hash="b-"+o.dataset.open;}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!document.getElementById("sheet").hidden)location.hash=cur;});
route();
if(map&&mFilter.size<EPOCHS.length)fitAll();

</script>
</body>
